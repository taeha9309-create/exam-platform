# 로컬 개발·테스트용 PostgreSQL (ADR-003). 데이터베이스 2개: exam(개발), exam_test(통합 테스트)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
    ports:
      # 내 컴퓨터에서만 접속(공용 와이파이에 DB를 노출하지 않는다). 개발용 비밀번호라 외부 노출 금지
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
